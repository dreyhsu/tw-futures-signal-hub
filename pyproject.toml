[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tw-futures-signal-hub"
version = "0.1.0"
description = "XQ-driven Taiwan individual-stock futures candidate dashboard"
requires-python = ">=3.10"
dependencies = ["Flask>=3.1", "pandas>=2.3", "requests>=2.32", "python-dotenv>=1.2", "finmind>=1.9", "pywinauto"]

[project.scripts]
twfsh = "tw_futures_signal_hub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
